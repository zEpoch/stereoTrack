paths:
  data_path: /home/share/huadjyin/home/zhoutao3/tracks/example_data/07_macaque_brain/cortex_v2
  input_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/02_macaque_brain_cortex_v2_mae_v1
  save_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/02_macaque_brain_cortex_v2_mae_v1_train

preprocess:
  # Raw coordinates are read from adata.obsm["spatial"] and copied to obsm["ccf"]
  # for compatibility with older StereoTrack scripts.
  source_spatial_key: spatial
  spatial_key: ccf
  graph_method: knn
  n_neighbors: 12
  knn_chunk_size: 100000
  patch_axes: 3
  compress_npz: false
  min_counts: 0

  # cortex_v2 h5ad files are already transformed. Use X directly.
  skip_normalize_log_scale: true
  expression_layer:

model:
  hidden_dim: 512
  latent_dim: 64
  dropout_rate: 0.1
  gene_mask_ratio: 0.5
  cell_mask_ratio: 0.2

training:
  patch_size: 16384
  n_epochs: 100
  learning_rate: 2e-4
  warmup_epochs: 5
  patience: 20
  grad_accum_steps: 4
  use_amp: false
  infer_batch_size: 4096

logging:
  use_tensorboard: false
  tensorboard_save_dir: ./logs/tensorboard
  use_wandb: false
  wandb_project: StereoTrack
  wandb_name: 02_Chen_Cell_cortex_v2
  wandb_save_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/02_macaque_brain_cortex_v2_mae_v1_train/wandb

