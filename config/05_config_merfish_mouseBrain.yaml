paths:
  data_path: /home/share/huadjyin/home/zhoutao3/tracks/example_data/14_merfish_mouseBrain/raw_data
  input_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/05_merfish_mouseBrain_mae_v1
  save_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/05_merfish_mouseBrain_mae_v1_train

preprocess:
  spatial_key: ccf
  source_spatial_key: X_CCF
  fallback_spatial_key: X_spatial_coords
  gene_name_column: gene_name
  filter_feature_is_filtered: true
  filter_high_quality_transfer: false
  drop_invalid_spatial: true
  graph_method: knn
  n_neighbors: 8
  knn_chunk_size: 200000
  patch_axes: 2
  compress_npz: false

model:
  hidden_dim: 512
  latent_dim: 64
  dropout_rate: 0.1
  gene_mask_ratio: 0.5
  cell_mask_ratio: 0.2
  n_encoder_layers: 3
  n_decoder_layers: 3
  niche_self_weight: 0.1

training:
  patch_size: 8192
  n_epochs: 100
  learning_rate: 2e-4
  warmup_epochs: 5
  patience: 20
  grad_accum_steps: 4
  use_amp: true
  infer_batch_size: 1024
  lambda_niche_recon: 1.0
  lambda_cell_recon: 1.0
  lambda_cell_mask: 1.0
  lambda_binary: 0.1

inference:
  output_genes: []

logging:
  use_tensorboard: false
  tensorboard_save_dir: ./logs/tensorboard
  use_wandb: true
  wandb_project: StereoTrack
  wandb_name: 05_merfish_mouseBrain_mae_v1
  wandb_save_dir: /home/share/huadjyin/home/zhoutao3/tracks/stereoTrack/out/05_merfish_mouseBrain_mae_v1_train/wandb
